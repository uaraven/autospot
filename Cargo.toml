[package]
name = "autospot"
version = "0.2.0"
edition = "2024"
license = "Unlicense"
authors = ["Oles Voronin <oles@voronin.cc>"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serialport = "4.10.1"
toml = "1.1.6"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_NetworkManagement_WiFi", "Networking_Connectivity", "Networking_NetworkOperators", "Foundation", "Foundation_Collections", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
