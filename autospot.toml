# Autospot configuration.
#
# This file is read once at startup. Restart the app (or the scheduled task) after
# editing it. Run `autospot.exe status` to see the Wi-Fi interfaces, adapter names and
# hotspot state that this config resolves to.

[monitor]
# How often to check Wi-Fi state, in seconds.
poll_interval_secs = 15

# How long Wi-Fi must be continuously down before the hotspot is switched on.
disconnect_threshold_secs = 120

# Switch the hotspot back off when Wi-Fi returns. Only hotspots that Autospot started
# itself are switched off; one you turned on by hand is left alone.
auto_disable_on_reconnect = true

[hotspot]
# Network name broadcast by the hotspot. Max 32 bytes.
ssid = "MyFallbackHotspot"

# WPA2 passphrase. Must be 8-63 characters.
passphrase = "changeme123"

# Auto | TwoPointFourGigahertz | FiveGigahertz | SixGigahertz
# Aliases "2.4GHz", "5GHz" and "6GHz" also work. Not every Wi-Fi driver supports
# setting a band; when it does not, Autospot logs a warning and uses the driver default.
band = "Auto"

# The adapter whose internet connection is shared, as named in Windows
# ("Ethernet", "Wi-Fi", ...). The hardware description works too. The adapter must be
# plugged in and up for the hotspot to have anything to share.
# `autospot.exe status` lists the exact names available on this machine.
# Use "auto" instead of a name to let Autospot pick whichever connected network currently
# has the best connectivity (it re-checks every time, and never picks the hotspot's own
# virtual adapter).
uplink_adapter = "auto"

[companion]
# Enables sending Wi-Fi/hotspot status to a companion microcontroller over serial.
# The device is found automatically by its USB manufacturer/product strings; no port
# needs to be configured, and it is safe to leave this on even when nothing is plugged in.
enabled = true

# If the device is not detected automatically, configure the USB vendor ID and Product ID
# to match the VID&PID of your microcontroller board (you can find this in Device manager)
# You can also uncommed custom VID&PID setting in boot.py in the controller firmware
# and make sure that VID&PID in boot.py and here match
vid=0x1209
pid=0x3a01

[logging]
# error | warn | info | debug | trace
# Level for the rotated log file. Defaults to "error" to keep routine status lines out
# of the file; the console (below) is where they're meant to be read live.
file_level = "error"

# Level for the console.
stdout_level = "info"

# Relative paths are resolved against the directory holding autospot.exe. The file is
# rotated daily, producing autospot.log.YYYY-MM-DD.
path = "autospot.log"
